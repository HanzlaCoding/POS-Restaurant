<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131B2A" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" stroke="#1F2937" stroke-width="8" />

  <!-- Grill Crossbars -->
  <g stroke="#1F2937" stroke-width="6" stroke-linecap="round" opacity="0.4">
    <line x1="96" y1="360" x2="416" y2="360" />
    <line x1="96" y1="390" x2="416" y2="390" />
    <line x1="96" y1="420" x2="416" y2="420" />
  </g>

  <!-- Stylized Flame & Grill Badge -->
  <g filter="url(#glow)">
    <path d="M256 80 C290 160 360 210 360 300 C360 370 310 420 256 420 C202 420 152 370 152 300 C152 235 200 180 230 130 C238 116 248 98 256 80 Z" fill="url(#flameGrad)" />
    <!-- Inner Flame Core -->
    <path d="M256 190 C276 240 310 270 310 320 C310 355 285 385 256 385 C227 385 202 355 202 320 C202 280 230 250 248 220 Z" fill="#FFFBEB" opacity="0.9" />
  </g>

  <!-- POS Terminal Text / Badge -->
  <rect x="176" y="440" width="160" height="34" rx="17" fill="#F97316" />
  <text x="256" y="462" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="3">POS SPEED</text>
</svg>